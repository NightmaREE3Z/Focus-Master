<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="platform-ui.js"></script>
  <title>BraveFox Focus Master</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-page="popup">
  <main class="popup-shell">
    <header class="topbar">
      <div class="brand-wordmark">BraveFox Focus Master</div>
      <span class="status-pill" title="Blocking remains active while the manager is locked">✓</span>
    </header>

    <section class="lock-panel" aria-labelledby="popupTitle">
      <div class="hero-row">
        <div class="hero-side"></div>
        <img class="lock-illustration" src="../icons/IconLocked.png" alt="Focus Master locked">
        <button id="openQuickBlock" class="quick-block-link" type="button">Quick Block Settings</button>
      </div>

      <h1 id="popupTitle">Focus Master is locked</h1>
      <p class="subtitle">Enter password to unlock</p>

      <form id="unlockForm" autocomplete="off" spellcheck="false">
        <div class="input-row">
          <input id="passwordInput" type="password" autocomplete="off" placeholder="Enter password" aria-label="Enter password">
          <button id="unlockButton" type="submit" aria-label="Continue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l7 7-7 7"/></svg>
          </button>
        </div>
        <p id="errorText" class="error" aria-live="polite"></p>
      </form>

      <p class="hint">The full-page password prompt appears only after the unlock period expires.</p>
      <section id="extensionUpdateArea" class="extension-update-area" aria-label="Extension updates">
        <button id="checkExtensionUpdate" class="extension-update-button" type="button">Check for updates</button>
      </section>
      <p id="enhancerVersion" class="enhancer-version">BraveFox Focus Master</p>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
